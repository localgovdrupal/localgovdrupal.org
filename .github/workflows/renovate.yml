##
# Run Renovate regularly to install updates.
---
name: Renovate
on:
  workflow_dispatch:
  schedule:
    - cron: '30 4,6 * * *'
concurrency: renovate
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7
      - name: Renovate
        uses: renovatebot/github-action@v40.2.7
        env:
          RENOVATE_GIT_AUTHOR: 'Agile Collective CI Bot <servers+renovate@agile.coop>'
          RENOVATE_USERNAME: 'agile-ci'
          RENOVATE_DEPENDENCY_DASHBOARD_TITLE: 'Renovate Dependency Dashboard (self-hosted) by GitHub Actions'
          RENOVATE_DEPENDENCY_DASHBOARD: true
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: 'github'
          RENOVATE_AUTODISCOVER: false
          RENOVATE_DRY_RUN: false
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
